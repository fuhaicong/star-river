// ═══════════════════════════════════════════════════════════
// 纹理生成
// ═══════════════════════════════════════════════════════════
function glowTex(r1,g1,b1,r2,g2,b2,size=128){
  const c=document.createElement('canvas');c.width=c.height=size;
  const ctx=c.getContext('2d');
  const g=ctx.createRadialGradient(size/2,size/2,0,size/2,size/2,size/2);
  g.addColorStop(0,`rgba(${r1},${g1},${b1},1)`);
  g.addColorStop(0.06,`rgba(${r1},${g1},${b1},.9)`);
  g.addColorStop(0.25,`rgba(${r2},${g2},${b2},.5)`);
  g.addColorStop(0.6,`rgba(${r2},${g2},${b2},.08)`);
  g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=g;ctx.fillRect(0,0,size,size);
  return new THREE.CanvasTexture(c);
}
const starTex = glowTex(255,255,255,170,200,255);
const goldTex = glowTex(255,240,200,255,190,80);
const warmTex = glowTex(255,220,180,255,150,60);

// ═══════════════════════════════════════════════════════════
// 第1层：深空星云 (Nebula) - 多层平面 + 自定义shader
// ═══════════════════════════════════════════════════════════
const nebulaGroup = new THREE.Group();
scene.add(nebulaGroup);

function createNebulaPlane(w,h,z,colors,opacity,speed){
  const geom=new THREE.PlaneGeometry(w,h);
  const mat=new THREE.ShaderMaterial({
    uniforms:{
      uTime:{value:0},
      uColor1:{value:new THREE.Color(colors[0])},
      uColor2:{value:new THREE.Color(colors[1])},
      uColor3:{value:new THREE.Color(colors[2])},
      uOpacity:{value:opacity},
    },
    vertexShader:/*glsl*/`
      varying vec2 vUv;
      void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}
    `,
    fragmentShader:/*glsl*/`
      varying vec2 vUv;
      uniform float uTime,uOpacity;
      uniform vec3 uColor1,uColor2,uColor3;
      float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
      float noise(vec2 p){
        vec2 i=floor(p),f=fract(p);
        f=f*f*(3.0-2.0*f);
        return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),
                   mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x),f.y);
      }
      float fbm(vec2 p){
        float v=0.0,a=.5;vec2 s=vec2(100.0);
        for(int i=0;i<6;i++){v+=a*noise(p);p=p*2.0+s;a*=.5;}
        return v;
      }
      void main(){
        vec2 uv=vUv;
        float t=uTime;
        // 多层星云
        float n1=fbm(uv*3.5+vec2(t*.06,sin(uv.x*2.0+t*.04)*.8));
        float n2=fbm(uv*2.8-vec2(t*.05,cos(uv.y*2.5+t*.05)*.6));
        float n3=fbm(uv*4.2+vec2(t*.03,-t*.04));
        // 垂直渐变：上下暗、中间亮
        float vy=smoothstep(0.0,.3,uv.y)*smoothstep(1.0,.7,uv.y);
        float cloud=n1*.45+n2*.35+n3*.2;
        cloud*=vy;
        // 颜色混合
        vec3 col=mix(uColor3,uColor2,smoothstep(.25,.5,cloud));
        col=mix(col,uColor1,smoothstep(.45,.75,cloud));
        float alpha=cloud*uOpacity;
        gl_FragColor=vec4(col,alpha);
      }
    `,
    transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,
  });
  const mesh=new THREE.Mesh(geom,mat);
  mesh.position.z=z;
  mesh.userData={mat,speed};
  return mesh;
}

// 流星系统

const shootingStars=[];
const MAX_SHOOTERS=3;

function spawnShootingStar(){
  const geom=new THREE.BufferGeometry();
  const pts=[
    new THREE.Vector3((Math.random()-.5)*8,1+Math.random()*3,-1-Math.random()*2),
    new THREE.Vector3(0,0,0),
    new THREE.Vector3(0,0,0),
  ];
  // 方向：往左下或右下
  const angle=-.3+(Math.random()-.5)*.6;
  const len=.8+Math.random()*2;
  pts[1].copy(pts[0]).add(new THREE.Vector3(Math.cos(angle)*len,Math.sin(angle)*len,0));
  // 尾迹延长
  pts[2].copy(pts[0]).add(new THREE.Vector3(Math.cos(angle+Math.PI)*.3,Math.sin(angle+Math.PI)*.3,0));
  geom.setFromPoints(pts);
  const mat=new THREE.LineBasicMaterial({
    color:0xffffff,transparent:true,opacity:0,
    blending:THREE.AdditiveBlending,depthWrite:false,
  });
  const line=new THREE.Line(geom,mat);
  scene.add(line);
  return{
    line,mat,birth:performance.now()/1000,
    duration:.4+.3*Math.random(),
    start:pts[0].clone(),end:pts[1].clone(),
    p0:pts[2].clone(),
  };
}

function createConstellationVisual(def){
  const scale=def.scale;
  const cx=def.worldPos.x,cy=def.worldPos.y,cz=def.worldPos.z;
  const starCount=def.stars.length;

  // 星座星点
  const sGeom=new THREE.BufferGeometry();
  const sPos=new Float32Array(starCount*3);
  const sSizes=new Float32Array(starCount);
  for(let i=0;i<starCount;i++){
    const s=def.stars[i];
    sPos[i*3]=cx+s.x*scale;
    sPos[i*3+1]=cy+s.y*scale;
    sPos[i*3+2]=cz+s.z*scale;
    // 星等越小越亮，映射到尺寸
    sSizes[i]=.1+.3/Math.max(1,s.mag);
  }
  sGeom.setAttribute('position',new THREE.BufferAttribute(sPos,3));
  sGeom.setAttribute('size',new THREE.BufferAttribute(sSizes,1));
  const isTaurus=def.id==='taurus';
  const sMat=new THREE.PointsMaterial({
    map:isTaurus?warmTex:starTex,
    size:.35,blending:THREE.AdditiveBlending,depthWrite:false,
    transparent:true,opacity:0,
    color:new THREE.Color(isTaurus?'#ffcc88':'#aaccff'),
  });
  const starPoints=new THREE.Points(sGeom,sMat);
  starPoints.userData.opacity=0;
  scene.add(starPoints);

  // 连线
  const lineGroup=new THREE.Group();
  for(const [a,b] of def.lines){
    const sa=def.stars[a],sb=def.stars[b];
    const lGeom=new THREE.BufferGeometry().setFromPoints([
      new THREE.Vector3(cx+sa.x*scale,cy+sa.y*scale,cz+sa.z*scale),
      new THREE.Vector3(cx+sb.x*scale,cy+sb.y*scale,cz+sb.z*scale),
    ]);
    const lMat=new THREE.LineBasicMaterial({
      color:isTaurus?0xffcc99:0xaaccff,
      transparent:true,opacity:0,
      blending:THREE.AdditiveBlending,depthWrite:false,
    });
    const line=new THREE.Line(lGeom,lMat);
    line.userData.opacity=0;
    lineGroup.add(line);
  }
  scene.add(lineGroup);

  // 中心辉光
  const glowGeom=new THREE.PlaneGeometry(3.5*scale,3.5*scale);
  const glowMat=new THREE.ShaderMaterial({
    uniforms:{
      uColor:{value:new THREE.Color(isTaurus?'#ff9944':'#4488ff')},
      uOpacity:{value:0},
    },
    vertexShader:'varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}',
    fragmentShader:`varying vec2 vUv;uniform vec3 uColor;uniform float uOpacity;
      void main(){
        float d=length(vUv-.5)*2.0;
        float a=smoothstep(1.0,0.0,d)*uOpacity;
        gl_FragColor=vec4(uColor,a);
      }`,
    transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,
  });
  const glowMesh=new THREE.Mesh(glowGeom,glowMat);
  glowMesh.position.copy(def.worldPos);
  glowMesh.userData.opacity=0;
  scene.add(glowMesh);

  return {def,starPoints,lineGroup,glowMesh,sPos,sSizes,sMat};
}

for(const def of constellationDefs){
  constellationObjects.push(createConstellationVisual(def));
}

// ═══════════════════════════════════════════════════════════
// 流星拖尾 — 丝带网格 + 渐变Shader
// ═══════════════════════════════════════════════════════════
const MAX_TRAIL=50;
const trailPts=[]; // {x,y,z}

// 丝带网格：每对相邻轨迹点生成一个四边形
const RIBBON_SEGMENTS=MAX_TRAIL-1;
const ribbonVertCount=RIBBON_SEGMENTS*4; // 每段4顶点
const ribbonIdxCount=RIBBON_SEGMENTS*6;  // 每段2三角=6索引

const ribbonPosArr=new Float32Array(ribbonVertCount*3);
const ribbonUvArr=new Float32Array(ribbonVertCount*2);
const ribbonIdxArr=new Uint16Array(ribbonIdxCount);

// 预建索引
for(let s=0;s<RIBBON_SEGMENTS;s++){
  const v=s*4;
  ribbonIdxArr[s*6]=v;ribbonIdxArr[s*6+1]=v+1;ribbonIdxArr[s*6+2]=v+2;
  ribbonIdxArr[s*6+3]=v+1;ribbonIdxArr[s*6+4]=v+3;ribbonIdxArr[s*6+5]=v+2;
}

const ribbonGeom=new THREE.BufferGeometry();
ribbonGeom.setAttribute('position',new THREE.BufferAttribute(ribbonPosArr,3));
ribbonGeom.setAttribute('uv',new THREE.BufferAttribute(ribbonUvArr,2));
ribbonGeom.setIndex(new THREE.BufferAttribute(ribbonIdxArr,1));
ribbonGeom.setDrawRange(0,0);

const ribbonMat=new THREE.ShaderMaterial({
  uniforms:{uTime:{value:0}},
  vertexShader:/*glsl*/`
    varying vec2 vUv;
    void main(){
      vUv=uv;
      gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);
    }
  `,
  fragmentShader:/*glsl*/`
    varying vec2 vUv;
    uniform float uTime;
    void main(){
      float t=vUv.x; // 0(尾) -> 1(头)
      // 柔和渐入渐出
      float alpha=smoothstep(0.0,0.06,t)*smoothstep(1.0,0.7,t);
      alpha*=0.9;
      // 金色流星：尾暗金 → 头亮白
      vec3 tailCol=vec3(0.5,0.2,0.03);
      vec3 midCol=vec3(1.0,0.65,0.15);
      vec3 headCol=vec3(1.0,0.95,0.75);
      vec3 col=mix(tailCol,midCol,smoothstep(0.0,0.35,t));
      col=mix(col,headCol,smoothstep(0.4,0.85,t));
      col+=vec3(0.5,0.35,0.15)*smoothstep(0.75,1.0,t);
      float edgeFade=1.0-abs(vUv.y-0.5)*1.8;
      alpha*=smoothstep(0.0,0.25,edgeFade);
      gl_FragColor=vec4(col,alpha);
    }
  `,
  transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,
  side:THREE.DoubleSide,
});
const ribbonMesh=new THREE.Mesh(ribbonGeom,ribbonMat);
ribbonMesh.renderOrder=998;
ribbonMesh.frustumCulled=false;
scene.add(ribbonMesh);

// 光标辉光
const cursorGlowGeom=new THREE.PlaneGeometry(.5,.5);
const cursorGlowMat=new THREE.ShaderMaterial({
  uniforms:{uColor:{value:new THREE.Color('#fffef0')},uOpacity:{value:0}},
  vertexShader:'varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}',
  fragmentShader:`varying vec2 vUv;uniform vec3 uColor;uniform float uOpacity;
    void main(){float d=length(vUv-.5)*2.;float a=exp(-d*3.5)*uOpacity*smoothstep(1.05,0.85,d);gl_FragColor=vec4(uColor,a);}`,
  transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,
});
const cursorGlow=new THREE.Mesh(cursorGlowGeom,cursorGlowMat);
cursorGlow.renderOrder=999;
scene.add(cursorGlow);

// 小火花
const SPARK_MAX=60;
const sparks=[];
const sparkGeom=new THREE.BufferGeometry();
const sparkPos=new Float32Array(SPARK_MAX*3);
const sparkCol=new Float32Array(SPARK_MAX*3);
sparkGeom.setAttribute('position',new THREE.BufferAttribute(sparkPos,3));
sparkGeom.setAttribute('color',new THREE.BufferAttribute(sparkCol,3));
sparkGeom.setDrawRange(0,0);
const sparkMat=new THREE.PointsMaterial({
  map:goldTex,size:.04,blending:THREE.AdditiveBlending,
  depthWrite:false,transparent:true,opacity:.8,vertexColors:true,
});
const sparkPoints=new THREE.Points(sparkGeom,sparkMat);
scene.add(sparkPoints);

function spawnSpark(x,y,z){
  const a=Math.random()*Math.PI*2;
  const s=.015+.04*Math.random();
  return{x,y,z,vx:Math.cos(a)*s,vy:Math.sin(a)*s,vz:(Math.random()-.5)*s,life:.35+.5*Math.random(),age:0};
}

// UI

const hintEl=document.getElementById('hint');

// ═══════════════════════════════════════════════════════════
// 交互状态 & 引导流程
// ═══════════════════════════════════════════════════════════
let mouseWorld=new THREE.Vector3();
let mouseActive=false;
let mouseNDC=new THREE.Vector2();
let lastInteraction=0;
let totalInteractionTime=0;    // 累计交互时长

// 引导流程状态机
// wandering → firstFading → firstAwaiting → firstDone → secondFading → secondAwaiting → finale
let flowState='wandering';
let flowTimer=0;
let activeDef=null;           // 当前展示文案的星座
let activeShowTimer=0;

let finaleTriggered=false;
let finalePhase=0;
let finaleStart=0;

function screenToWorld(sx,sy){
  const ndc=new THREE.Vector3((sx/W())*2-1,-(sy/H())*2+1,.5);
  ndc.unproject(camera);
  const dir=ndc.clone().sub(camera.position).normalize();
  const dist=-camera.position.z/dir.z;
  return camera.position.clone().add(dir.multiplyScalar(dist));
}

// ═══════════════════════════════════════════════════════════
// 事件
// ═══════════════════════════════════════════════════════════
function onMove(x,y){
  mouseActive=true;lastInteraction=performance.now()/1000;
  mouseWorld.copy(screenToWorld(x,y));
  trailPts.push(mouseWorld.clone());
  while(trailPts.length>MAX_TRAIL)trailPts.shift();
  mouseNDC.set((x/W())*2-1,-(y/H())*2+1);
}
function onUp(){mouseActive=false;}

window.addEventListener('mousemove',e=>onMove(e.clientX,e.clientY));
window.addEventListener('touchmove',e=>{e.preventDefault();onMove(e.touches[0].clientX,e.touches[0].clientY);},{passive:false});
window.addEventListener('mouseup',onUp);
window.addEventListener('touchend',onUp);
window.addEventListener('touchcancel',onUp);
window.addEventListener('resize',()=>{
  camera.aspect=W()/H();camera.updateProjectionMatrix();
  renderer.setSize(W(),H());composer.setSize(W(),H());
  bloom.resolution.set(W(),H());
});

updateStatus();

// ═══════════════════════════════════════════════════════════
// 主循环
// ═══════════════════════════════════════════════════════════
const clock=new THREE.Clock();

function animate(ts){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),.1);
  const t=ts*.001;

  // ── 星云动画 ──────────────────────────────────────────
  for(const neb of nebulaGroup.children){
    neb.userData.mat.uniforms.uTime.value=t;
  }

  // ── 远景微转 ──────────────────────────────────────────
  deepStars.rotation.y+=dt*.015;
  deepStars.rotation.x+=dt*.006;

  // ── 主星漂移 ──────────────────────────────────────────
  for(let i=0;i<mainCount;i++){
    const i3=i*3;
    if(!finaleTriggered){ // 终章期间完全由终章逻辑控制粒子
      const ph=mainPhase[i];
      mainPos[i3]=mainBase[i3]+Math.sin(t*.35+ph)*.07+Math.cos(t*.55+ph*1.7)*.04;
      mainPos[i3+1]=mainBase[i3+1]+Math.cos(t*.4+ph)*.07+Math.sin(t*.45+ph*1.3)*.04;
      mainPos[i3+2]=mainBase[i3+2]+Math.sin(t*.28+ph)*.03;
    }
  }
  mainGeom.attributes.position.needsUpdate=true;

  // ── 亮星 ──────────────────────────────────────────────
  for(let i=0;i<brightCount;i++){
    const i3=i*3;
    brightPos[i3]=brightBase[i3]+Math.sin(t*.25+i)*.12;
    brightPos[i3+1]=brightBase[i3+1]+Math.cos(t*.3+i)*.12;
    brightPos[i3+2]=brightBase[i3+2]+Math.sin(t*.2+i)*.06;
  }
  brightGeom.attributes.position.needsUpdate=true;

  // ── 流星丝带更新 ───────────────────────────────────────
  if(!mouseActive&&trailPts.length>0){trailPts.shift();}

  const tl=trailPts.length;
  const segments=Math.max(0,tl-1);
  ribbonGeom.setDrawRange(0,segments*6);

  // 光标辉光
  if(mouseActive&&tl>0){
    const head=trailPts[tl-1];
    cursorGlow.position.copy(head);
    cursorGlow.lookAt(camera.position);
    cursorGlowMat.uniforms.uOpacity.value=Math.min(.9,cursorGlowMat.uniforms.uOpacity.value+.2);
  }else{
    cursorGlowMat.uniforms.uOpacity.value*=.88;
  }

  // 构建丝带网格
  if(segments>0){
    for(let s=0;s<segments;s++){
      const p0=trailPts[s],p1=trailPts[s+1];
      const t=s/Math.max(1,segments-1); // 0→1
      const w=.008+t*t*.12; // 尾部细→头部粗
      const dx=p1.x-p0.x,dy=p1.y-p0.y;
      const dl=Math.sqrt(dx*dx+dy*dy)+.001;
      const px=-dy/dl*w,py=dx/dl*w;

      const v=s*4;
      ribbonPosArr[v*3]=p0.x-px;ribbonPosArr[v*3+1]=p0.y-py;ribbonPosArr[v*3+2]=p0.z;
      ribbonPosArr[v*3+3]=p0.x+px;ribbonPosArr[v*3+4]=p0.y+py;ribbonPosArr[v*3+5]=p0.z;
      ribbonPosArr[v*3+6]=p1.x-px;ribbonPosArr[v*3+7]=p1.y-py;ribbonPosArr[v*3+8]=p1.z;
      ribbonPosArr[v*3+9]=p1.x+px;ribbonPosArr[v*3+10]=p1.y+py;ribbonPosArr[v*3+11]=p1.z;
      ribbonUvArr[v*2]=t;ribbonUvArr[v*2+1]=0;
      ribbonUvArr[v*2+2]=t;ribbonUvArr[v*2+3]=1;
      const tn=Math.min(1,t+1/Math.max(1,segments-1));
      ribbonUvArr[v*2+4]=tn;ribbonUvArr[v*2+5]=0;
      ribbonUvArr[v*2+6]=tn;ribbonUvArr[v*2+7]=1;
    }
    ribbonGeom.attributes.position.needsUpdate=true;
    ribbonGeom.attributes.uv.needsUpdate=true;
  }

  // ── 火花 ────────────────────────────────────────────────
  if(mouseActive&&tl>1){
    const h=trailPts[tl-1];
    for(let s=0;s<2;s++)sparks.push(spawnSpark(h.x,h.y,h.z));
  }
  let sc=0;
  for(let i=sparks.length-1;i>=0;i--){
    const s=sparks[i];s.age+=dt;
    if(s.age>s.life){sparks.splice(i,1);continue;}
    if(sc<SPARK_MAX){
      const p=s.age/s.life;
      sparkPos[sc*3]=s.x+s.vx*p*2;
      sparkPos[sc*3+1]=s.y+s.vy*p*2;
      sparkPos[sc*3+2]=s.z+s.vz*p*2;
      sparkCol[sc*3]=1*(1-p);sparkCol[sc*3+1]=.55*(1-p);sparkCol[sc*3+2]=.18*(1-p);
      sc++;
    }
  }
  sparkGeom.setDrawRange(0,sc);
  if(sc>0){sparkGeom.attributes.position.needsUpdate=true;sparkGeom.attributes.color.needsUpdate=true;}

  // ── 星座屏幕位置更新 ───────────────────────────────────
  for(const def of constellationDefs){
    const sp=def.worldPos.clone().project(camera);
    def.screenPos.set((sp.x*.5+.5)*W(),(-sp.y*.5+.5)*H());
  }

  // ── 星座检测 & 引导流程 ───────────────────────────────
  const timeSinceInteraction=t-lastInteraction;

  if(!finaleTriggered){
    // 累计交互时间
    if(mouseActive)totalInteractionTime+=dt;

    // 计算每个星座到鼠标的距离
    const dists={};
    for(const def of constellationDefs){
      const dx=mouseNDC.x*W()/2-(def.screenPos.x-W()/2);
      const dy=mouseNDC.y*H()/2-(def.screenPos.y-H()/2);
      dists[def.id]=Math.sqrt(dx*dx+dy*dy);
    }

    const aquarius=constellationDefs[0];
    const taurus=constellationDefs[1];

    // ── 状态机 ──────────────────────────────────────────
    if(flowState==='wandering'){
      hintEl.classList.remove('hide');
      hintEl.textContent='滑动手指 · 画出流星';
      // 交互够久后，第一个星座淡入
      if(totalInteractionTime>1.5&&mouseActive){
        flowState='firstFading';flowTimer=0;
      }
    }

    if(flowState==='firstFading'){
      hintEl.textContent='好像有什么在浮现…';
      // 2.5秒后进入等待穿过状态
      if(flowTimer>2.5){flowState='firstAwaiting';flowTimer=0;}
    }

    if(flowState==='firstAwaiting'){
      hintEl.classList.remove('hide');
      hintEl.textContent='向那颗星靠近 ✦';
      // 鼠标穿过（进入范围）
      if(mouseActive&&dists[aquarius.id]<180){
        aquarius.discovered=true;activeDef=aquarius;activeShowTimer=0;
        updateStatus();showText(aquarius);
        flowState='firstDone';flowTimer=0;
      }
    }

    if(flowState==='firstDone'){
      hintEl.classList.add('hide');
      if(activeShowTimer>4&&(!activeDef||activeShowTimer>4)){
        // 文案展示完后进入第二阶段
        hideText();activeDef=null;
        flowState='secondFading';flowTimer=0;
      }
    }

    if(flowState==='secondFading'){
      // 2s后进入等待
      if(flowTimer>2.5){flowState='secondAwaiting';flowTimer=0;}
    }

    if(flowState==='secondAwaiting'){
      hintEl.classList.remove('hide');
      hintEl.textContent='出现了另一颗星，试试穿过她 ✦';
      if(mouseActive&&dists[taurus.id]<180){
        taurus.discovered=true;activeDef=taurus;activeShowTimer=0;
        updateStatus();showText(taurus);
        flowState='done';flowTimer=0;
      }
    }

    if(flowState==='done'){
      hintEl.classList.add('hide');
      if(activeShowTimer>3){
        hideText();activeDef=null;
        finaleTriggered=true;finalePhase=0;finaleStart=t;
        hintEl.classList.add('hide');
      }
    }

    // 通用计时
    flowTimer+=dt;
    if(activeDef)activeShowTimer+=dt;

    // 如果没在交互且 wander 超时，提示
    if(flowState==='wandering'&&timeSinceInteraction>8&&!mouseActive){
      hintEl.classList.remove('hide');
      hintEl.textContent='滑动手指 · 画出流星';
    }
  }

  // ── 星座视觉更新（渐进显示 + 脉冲引导） ────────────────
  for(const obj of constellationObjects){
    const def=obj.def;
    const isFirst=(def.id==='aquarius');
    const isSecond=(def.id==='taurus');
    const isActive=activeDef===def;
    const isDisc=def.discovered;

    // 根据流程状态决定可见性
    let visible=false;
    if(isFirst){
      visible=flowState==='firstFading'||flowState==='firstAwaiting'||flowState==='firstDone'||isDisc;
    }
    if(isSecond){
      visible=flowState==='secondFading'||flowState==='secondAwaiting'||flowState==='done'||isDisc;
    }
    // 终章触发后全部可见
    if(finaleTriggered)visible=true;

    // 淡入进度
    let fadeIn=1;
    if(isFirst&&flowState==='firstFading')fadeIn=Math.min(1,flowTimer/2.5);
    if(isSecond&&flowState==='secondFading')fadeIn=Math.min(1,flowTimer/2.5);

    // 脉冲（等待穿过时）
    let pulse=1;
    if((isFirst&&flowState==='firstAwaiting')||(isSecond&&flowState==='secondAwaiting')){
      pulse=1+.12*Math.sin(t*4.5);
    }

    // 目标透明度
    let targetOp=visible?(isActive?.9:isDisc?.65:.6*fadeIn*pulse):0;
    let lineTarget=visible?(isActive?.55:isDisc?.4:.3*fadeIn*pulse):0;
    let glowTarget=visible?(isActive?.22:isDisc?.12:.08*fadeIn*pulse):0;

    // 平滑过渡
    const spd=dt*3.5;
    obj.starPoints.userData.opacity+=(targetOp-obj.starPoints.userData.opacity)*spd;
    obj.glowMesh.userData.opacity+=(glowTarget-obj.glowMesh.userData.opacity)*spd;

    obj.sMat.opacity=Math.max(0,obj.starPoints.userData.opacity);
    obj.glowMesh.material.uniforms.uOpacity.value=Math.max(0,obj.glowMesh.userData.opacity);

    // Aldebaran 呼吸
    if(def.id==='taurus'&&isDisc){
      obj.sSizes[0]=.18+Math.sin(t*3)*.03;
    }

    // 连线
    for(const line of obj.lineGroup.children){
      line.userData.opacity+=(lineTarget-line.userData.opacity)*spd;
      line.material.opacity=Math.max(0,line.userData.opacity);
    }

    // 激活时呼吸缩放
    if(isActive){
      const breathe=1+Math.sin(t*2.5)*.025;
      obj.starPoints.scale.setScalar(breathe);
      obj.lineGroup.scale.setScalar(breathe);
    }
  }

  // ── 终章动画：打碎 → 爱心 ──────────────────────────────
  if(finaleTriggered){
    const ft=t-finaleStart;
    // 懒加载爱心目标（只在终章触发时生成一次）
    if(!finaleEl._heartTargets){
      // 生成爱心形状的粒子目标
      const hTargets=[];
      // 爱心参数方程: x=16sin³t, y=13cost-5cos2t-2cos3t-cos4t
      const outline=[];
      const outlineN=400;
      for(let i=0;i<outlineN;i++){
        const a=(i/outlineN)*Math.PI*2;
        const sx=16*Math.pow(Math.sin(a),3);
        const sy=13*Math.cos(a)-5*Math.cos(2*a)-2*Math.cos(3*a)-Math.cos(4*a);
        outline.push({x:sx*.11,y:sy*.11});
      }
      // 隐式爱心方程填内部: (x²+y²-1)³ - x²y³ ≤ 0
      function insideHeart(x,y,s){
        const X=x/s,Y=y/s;
        return Math.pow(X*X+Y*Y-1,3)-X*X*Y*Y*Y<=0;
      }
      const scale=1.5;
      for(let i=0;i<mainCount;i++){
        let px,py,inside;
        if(i<outlineN){
          // 前400个粒子放轮廓
          px=outline[i].x;py=outline[i].y;
        }else{
          // 其余粒子用 rejection sampling 填充内部
          let tries=0;
          do{
            px=(Math.random()-.5)*4.0;
            py=(Math.random()-.5)*4.4+0.3;
            inside=insideHeart(px,py,scale);
            tries++;
          }while(!inside&&tries<50);
          if(!inside){px=outline[i%outlineN].x;py=outline[i%outlineN].y;}
        }
        hTargets.push({x:px,y:py});
      }
      finaleEl._heartTargets=hTargets;
    }
    const heartTgts=finaleEl._heartTargets;

    if(finalePhase===0){
      if(ft>.5){finalePhase=1;finaleStart=t;}
    }
    if(finalePhase===1){
      // 阶段1: 螺旋汇聚到中心 (1.5s)
      const p=Math.min(1,ft/1.8);
      const e=1-Math.pow(1-p,3);
      for(let i=0;i<mainCount;i++){
        const i3=i*3;
        const a=i*.017+ft*3;
        const R=(1-e)*4.5;
        const tx=Math.cos(a)*R,ty=Math.sin(a)*R,tz=(1-e)*3;
        mainPos[i3]+=(tx-mainPos[i3])*.06;
        mainPos[i3+1]+=(ty-mainPos[i3+1])*.06;
        mainPos[i3+2]+=(tz-mainPos[i3+2])*.06;
      }
      mainGeom.attributes.position.needsUpdate=true;
      bloom.strength=1.3+e*.8;
      if(p>=1){finalePhase=2;finaleStart=t;}
    }
    if(finalePhase===2){
      // 阶段2: 中心高速旋转蓄力 (0.6s)
      const p=Math.min(1,ft/.7);
      for(let i=0;i<mainCount;i++){
        const i3=i*3;
        const a=i*.025+ft*6;
        const r=.18*Math.max(0,1-p*.8);
        mainPos[i3]=Math.cos(a)*r+Math.sin(ft*10+i)*.02;
        mainPos[i3+1]=Math.sin(a)*r+Math.cos(ft*11+i)*.02;
        mainPos[i3+2]=Math.sin(i*.1+ft*8)*.04;
      }
      mainGeom.attributes.position.needsUpdate=true;
      bloom.strength=2.0+p*.8;
      if(p>=1){finalePhase=3;finaleStart=t;}
    }
    if(finalePhase===3){
      // 阶段3: 爆炸！(.5s)
      const p=Math.min(1,ft/.55);
      for(let i=0;i<mainCount;i++){
        const i3=i*3;
        const a=i*.035;
        const R=p*5;
        mainPos[i3]=Math.cos(a)*R*(.8+Math.random()*.4);
        mainPos[i3+1]=Math.sin(a)*R*(.8+Math.random()*.4);
        mainPos[i3+2]=(Math.random()-.5)*R*1.8;
      }
      mainGeom.attributes.position.needsUpdate=true;
      bloom.strength=2.5-p*.5;
      if(p>=1){finalePhase=4;finaleStart=t;}
    }
    if(finalePhase===4){
      // 阶段4: 粒子飞向爱心形状 (3s)
      const p=Math.min(1,ft/3.2);
      const e=1-Math.pow(1-p,2.5); // easeOut
      for(let i=0;i<mainCount;i++){
        const i3=i*3;
        const tgt=heartTgts[i];
        // 从爆炸位置 lerp 到爱心位置
        const sx=mainPos[i3],sy=mainPos[i3+1],sz=mainPos[i3+2];
        const tx=tgt.x,ty=tgt.y,tz=0;
        mainPos[i3]=sx+(tx-sx)*e*.15+tx*(1-(1-e)*.15); // 混合逼近
        mainPos[i3+1]=sy+(ty-sy)*e*.15+ty*(1-(1-e)*.15);
        mainPos[i3+2]=sz+(tz-sz)*e*.15+tz*(1-(1-e)*.15);
        // 简化: 直接用大力 lerp
        mainPos[i3]+=(tx-mainPos[i3])*.06;
        mainPos[i3+1]+=(ty-mainPos[i3+1])*.06;
        mainPos[i3+2]+=(tz-mainPos[i3+2])*.06;
      }
      mainGeom.attributes.position.needsUpdate=true;
      bloom.strength=1.6+.4*(1-e);
      // 爱心快形成时显示文字
      if(p>.6&&!finaleEl.classList.contains('on')){
        finaleEl.querySelector('h2').textContent=processText(C.finaleTitle);
        finaleEl.querySelector('p').textContent=processText(C.finaleSub);
        finaleEl.classList.add('on');
      }
      if(p>=1){finalePhase=5;finaleStart=t;}
    }
    if(finalePhase===5){
      // 阶段5: 爱心呼吸（永久）
      const breathe=1+Math.sin(t*2.2)*.03;
      for(let i=0;i<mainCount;i++){
        const i3=i*3;
        const tgt=heartTgts[i];
        mainPos[i3]=tgt.x*breathe+Math.sin(t*1.8+i*.07)*.012;
        mainPos[i3+1]=tgt.y*breathe+Math.cos(t*2.0+i*.06)*.012;
        mainPos[i3+2]=Math.sin(t*1.5+i*.04)*.008;
      }
      mainGeom.attributes.position.needsUpdate=true;
      bloom.strength=1.7+Math.sin(t*.6)*.12;
      // 相机轻轻拉远看爱心全景
      if(!finaleEl._camReset){
        finaleEl._camReset=true;
      }
      camera.position.x+=(-camera.position.x)*.015;
      camera.position.y+=(-camera.position.y)*.015;
    }
  }

  // ── 相机微动 ──────────────────────────────────────────
  if(mouseActive&&!finaleTriggered){
    const tx=mouseNDC.x*.35,ty=mouseNDC.y*.2;
    camera.position.x+=(tx-camera.position.x)*.025;
    camera.position.y+=(ty-camera.position.y)*.025;
  }else if(!finaleTriggered){
    camera.position.x+=(-camera.position.x)*.004;
    camera.position.y+=(-camera.position.y)*.004;
  }
  camera.lookAt(0,0,0);

  // ── 渲染 ──────────────────────────────────────────────
  composer.render();
}

function processText(s){return s.replace(/\{name\}/g,C.herName);}

// ═══════════════════════════════════════════════════════════
// 启动
// ═══════════════════════════════════════════════════════════
requestAnimationFrame(animate);

// 初始提示：wandering 状态
hintEl.classList.remove('hide');
hintEl.textContent='滑动手指 · 画出流星';

console.log('%c🌌 星河漫游 %c已就绪 — 画出流星，遇见星座',
  'font-size:1.2em;color:#ffd700;','color:#aaa;');
</script>
